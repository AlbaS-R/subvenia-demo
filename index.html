
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subvenia</title>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    :root {
      --primary: #44edcc;
      --primary-foreground: #00382e;
      --primary-hover: #6ff0d8;

      --secondary: #3b82f6;
      --secondary-foreground: #eff6ff;
      --secondary-hover: #60a5fa;

      --tertiary: #00df81;
      --tertiary-foreground: #00382e;
      --tertiary-hover: #34f5a6;

      --background: #101415;
      --foreground: #ffffff;

      --card: rgba(10, 27, 51, 0.72);
      --card-foreground: #ffffff;

      --popover: rgba(16, 20, 21, 0.92);
      --popover-foreground: #e0e3e5;

      --muted: #1d2022;
      --muted-foreground: #bfe9df;

      --accent: rgba(68, 237, 204, 0.12);
      --accent-foreground: #ffffff;

      --destructive: #ffb4ab;
      --destructive-foreground: #690005;

      --border: #323537;
      --input: #323537;
      --ring: #44edcc;

      --sidebar-background: #191c1e;
    }

    [data-theme="dark"] {
      --primary: #44edcc;
      --primary-foreground: #00382e;
      --primary-hover: #6ff0d8;
      --secondary: #3b82f6;
      --secondary-foreground: #eff6ff;
      --secondary-hover: #60a5fa;
      --tertiary: #00df81;
      --tertiary-foreground: #00382e;
      --tertiary-hover: #34f5a6;
      --background: #101415;
      --foreground: #ffffff;
      --card: rgba(10, 27, 51, 0.72);
      --card-foreground: #ffffff;
      --popover: rgba(16, 20, 21, 0.92);
      --popover-foreground: #e0e3e5;
      --muted: #1d2022;
      --muted-foreground: #bfe9df;
      --accent: rgba(68, 237, 204, 0.12);
      --accent-foreground: #ffffff;
      --destructive: #ffb4ab;
      --destructive-foreground: #690005;
      --border: #323537;
      --input: #323537;
      --ring: #44edcc;
      --sidebar-background: #191c1e;
    }

    [data-theme="light"] {
      --primary: #44edcc;
      --primary-foreground: #00382e;
      --primary-hover: #6ff0d8;
      --secondary: #3b82f6;
      --secondary-foreground: #eff6ff;
      --secondary-hover: #60a5fa;
      --tertiary: #00df81;
      --tertiary-foreground: #00382e;
      --tertiary-hover: #34f5a6;
      --background: #101415;
      --foreground: #ffffff;
      --card: rgba(10, 27, 51, 0.72);
      --card-foreground: #ffffff;
      --popover: rgba(16, 20, 21, 0.92);
      --popover-foreground: #ffffff;
      --muted: #1d2022;
      --muted-foreground: #bfe9df;
      --accent: rgba(68, 237, 204, 0.12);
      --accent-foreground: #ffffff;
      --destructive: #ffb4ab;
      --destructive-foreground: #690005;
      --border: #323537;
      --input: #323537;
      --ring: #44edcc;
      --sidebar-background: #191c1e;
    }

    body {
      background-color: #101415;
      background-image:
        radial-gradient(at 0% 0%, rgba(0, 209, 178, 0.16) 0, transparent 56%),
        radial-gradient(at 100% 100%, rgba(41, 121, 255, 0.16) 0, transparent 56%),
        radial-gradient(at 50% 45%, rgba(10, 27, 51, 0.98) 0, rgba(16, 20, 21, 0.92) 58%, rgba(16, 20, 21, 1) 100%);
      min-height: 100vh;
      color: #ffffff;
      overflow-x: hidden;
      /* font-family is now handled by Tailwind config */
    }

    html, body {
      transition: background-color 450ms ease, color 350ms ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -2;
      background:
        radial-gradient(65rem 36rem at 2% 0%, rgba(68, 237, 204, 0.2), transparent 55%),
        radial-gradient(52rem 34rem at 98% 8%, rgba(59, 130, 246, 0.18), transparent 52%),
        radial-gradient(56rem 32rem at 50% 100%, rgba(0, 223, 129, 0.12), transparent 58%);
      transition: background 650ms ease, opacity 450ms ease, filter 450ms ease;
      animation: aurora-wander 32s ease-in-out infinite;
    }

    .aurora-bg {
      position: relative;
      isolation: isolate;
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: hidden;
    }

    .aurora-bg::before,
    .aurora-bg::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 24rem;
      height: 24rem;
      border-radius: 9999px;
      filter: blur(45px);
      opacity: 0.65;
      pointer-events: none;
    }

    .aurora-bg::before {
      top: -8rem;
      right: -6rem;
      background: radial-gradient(circle, rgba(184, 78, 157, 0.6) 0%, rgba(184, 78, 157, 0) 70%);
    }

    .aurora-bg::after {
      bottom: -10rem;
      left: -5rem;
      background: radial-gradient(circle, rgba(26, 233, 197, 0.42) 0%, rgba(26, 233, 197, 0) 70%);
    }

    .glass-panel {
      background: rgba(10, 27, 51, 0.72);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        inset 1px 1px 0 rgba(88, 251, 218, 0.1),
        0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .glass-card {
      background: rgba(10, 27, 51, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .fullscreen-panel {
      background:
        radial-gradient(60rem 34rem at 0% 0%, rgba(68, 237, 204, 0.12), transparent 58%),
        radial-gradient(52rem 30rem at 100% 10%, rgba(59, 130, 246, 0.12), transparent 54%),
        #101415 !important;
      isolation: isolate;
    }

    .inner-glow {
      box-shadow: inset 1px 1px 0px 0px rgba(88, 251, 218, 0.1);
    }

    /* Global look & feel for all screens */
    #root {
      position: relative;
      z-index: 0;
    }

    #root::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(48rem 28rem at 10% 12%, rgba(68, 237, 204, 0.06), transparent 60%),
        radial-gradient(42rem 24rem at 88% 18%, rgba(176, 198, 255, 0.08), transparent 62%);
      transition: background 650ms ease, opacity 450ms ease;
    }

    /* Theme transition system */
    * {
      transition-property: background-color, border-color, color, fill, stroke, box-shadow, opacity, transform, backdrop-filter, -webkit-backdrop-filter;
      transition-duration: 280ms;
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    .glass-panel,
    .glass-card,
    .bg-card,
    input,
    textarea,
    select,
    button,
    a,
    [class*="bg-"],
    [class*="text-"],
    [class*="border-"] {
      transition-duration: 360ms;
    }

    /* Gentle fade/slide on first paint for key containers */
    @keyframes soft-enter {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.995);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes aurora-wander {
      0%, 100% {
        transform: translate3d(-8%, -6%, 0) scale(1) rotate(0deg);
      }
      33% {
        transform: translate3d(6%, 4%, 0) scale(1.06) rotate(120deg);
      }
      66% {
        transform: translate3d(-4%, 8%, 0) scale(1.03) rotate(240deg);
      }
    }

    @keyframes mesh-float {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(0, -2%, 0) scale(1.03); }
    }

    @keyframes flow-gradient-move {
      0%, 100% { background-position: 0% 40%; }
      50% { background-position: 100% 60%; }
    }

    @keyframes grid-drift {
      0%, 100% { opacity: 0.035; transform: translate3d(0, 0, 0); }
      50% { opacity: 0.055; transform: translate3d(-12px, -8px, 0); }
    }

    @keyframes organic-glow {
      0%, 100% {
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.35), 0 0 0 rgba(68, 237, 204, 0);
      }
      50% {
        box-shadow: 0 14px 38px rgba(0, 0, 0, 0.4), 0 0 22px rgba(68, 237, 204, 0.12);
      }
    }

    @keyframes ms-kinetic-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes shimmer-x {
      0% { background-position: -180% 0; }
      100% { background-position: 180% 0; }
    }

    .site-mesh-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-color: #101415;
      background-image:
        radial-gradient(at 0% 0%, rgba(0, 209, 178, 0.16) 0, transparent 56%),
        radial-gradient(at 100% 100%, rgba(41, 121, 255, 0.16) 0, transparent 56%),
        radial-gradient(at 50% 45%, rgba(10, 27, 51, 0.98) 0, rgba(16, 20, 21, 0.92) 58%, rgba(16, 20, 21, 1) 100%);
      animation: mesh-float 18s ease-in-out infinite;
    }

    .site-aurora-layer {
      position: fixed;
      inset: -45%;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 75% 55% at 25% 25%, rgba(68, 237, 204, 0.2), transparent 58%),
        radial-gradient(ellipse 65% 50% at 78% 72%, rgba(59, 130, 246, 0.18), transparent 55%);
      animation: aurora-wander 32s ease-in-out infinite;
      opacity: 0.75;
    }

    .site-flow-gradient {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.35;
      background: linear-gradient(118deg, transparent 0%, rgba(68, 237, 204, 0.14) 22%, transparent 42%, rgba(96, 165, 250, 0.12) 58%, transparent 78%, rgba(68, 237, 204, 0.1) 100%);
      background-size: 240% 240%;
      animation: flow-gradient-move 20s ease-in-out infinite;
    }

    .site-grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 90% 75% at 50% 35%, black 0%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse 90% 75% at 50% 35%, black 0%, transparent 72%);
      animation: grid-drift 24s ease-in-out infinite;
    }

    .ms-kinetic-text,
    .method-gradient-headline {
      background: linear-gradient(118deg, #f8fffe 0%, #b8f5eb 14%, #44edcc 32%, #5eead4 44%, #7dd3fc 58%, #e0fdfa 72%, #44edcc 88%, #f0fffc 100%);
      background-size: 280% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: ms-kinetic-shift 20s ease-in-out infinite;
    }

    .motion-shimmer {
      background-image: linear-gradient(110deg, rgba(68, 237, 204, 0.08) 0%, rgba(68, 237, 204, 0.24) 50%, rgba(68, 237, 204, 0.08) 100%);
      background-size: 220% 100%;
      animation: shimmer-x 4.8s linear infinite;
    }

    #root > div {
      animation: soft-enter 480ms ease-out;
    }

    /* Better hover feedback for interactive elements */
    button:hover,
    a:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Respect reduced-motion user preference */
    @media (prefers-reduced-motion: reduce) {
      * {
        transition-duration: 1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    input,
    textarea,
    select {
      background: rgba(16, 20, 21, 0.7) !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: #e0e3e5 !important;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    input::placeholder,
    textarea::placeholder {
      color: #9ca3af !important;
    }

    button {
      transition: all 220ms ease;
    }

    button:not(.fab-button):not(.search-type-btn) {
      border-color: rgba(255, 255, 255, 0.12);
    }

    .bg-card,
    .search-stage-container .result-card,
    .search-stage-container .search-panel,
    .search-stage-container .message-card,
    .search-stage-container .budget-info,
    .search-stage-container .collapsible-section summary,
    .search-stage-container .collapsible-content {
      background: rgba(10, 27, 51, 0.55) !important;
      border: 1px solid rgba(255, 255, 255, 0.07) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .search-stage-container .card-source {
      background-color: rgba(68, 237, 204, 0.12) !important;
      color: #89f7e1 !important;
    }

    .text-neutral-900,
    .text-neutral-800,
    .text-neutral-700 {
      color: #e0e3e5 !important;
    }

    .text-neutral-600,
    .text-neutral-500,
    .text-muted-foreground {
      color: #c5c6ce !important;
    }

    .border-border,
    .border-neutral-200,
    .border-neutral-300 {
      border-color: rgba(255, 255, 255, 0.1) !important;
    }

    .bg-background {
      background-color: transparent !important;
    }

    /* Explicit light-mode overrides for global glass styles */
    [data-theme="light"] body {
      background: linear-gradient(160deg, #eff6ff 0%, #f8fafc 42%, #f1f5f9 100%);
      color: #0f172a;
    }

    [data-theme="light"] body::before {
      background:
        radial-gradient(60rem 34rem at 0% 0%, rgba(14, 165, 233, 0.16), transparent 58%),
        radial-gradient(48rem 30rem at 100% 10%, rgba(124, 58, 237, 0.14), transparent 54%),
        radial-gradient(48rem 28rem at 50% 100%, rgba(5, 150, 105, 0.1), transparent 60%);
    }

    [data-theme="light"] #root::before {
      background:
        radial-gradient(42rem 24rem at 8% 10%, rgba(56, 189, 248, 0.1), transparent 62%),
        radial-gradient(38rem 20rem at 90% 20%, rgba(167, 139, 250, 0.09), transparent 64%);
    }

    [data-theme="light"] .glass-panel,
    [data-theme="light"] .glass-card,
    [data-theme="light"] .bg-card,
    [data-theme="light"] .search-stage-container .result-card,
    [data-theme="light"] .search-stage-container .search-panel,
    [data-theme="light"] .search-stage-container .message-card,
    [data-theme="light"] .search-stage-container .budget-info,
    [data-theme="light"] .search-stage-container .collapsible-section summary,
    [data-theme="light"] .search-stage-container .collapsible-content,
    [data-theme="light"] [class*="bg-card"],
    [data-theme="light"] [class*="bg-neutral-900"],
    [data-theme="light"] [class*="bg-neutral-800"],
    [data-theme="light"] [class*="bg-slate-900"],
    [data-theme="light"] [class*="bg-slate-950"] {
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.84), rgba(248, 250, 252, 0.72)) !important;
      border: 1px solid rgba(148, 163, 184, 0.28) !important;
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.82),
        0 16px 34px rgba(15, 23, 42, 0.1) !important;
    }

    [data-theme="light"] input,
    [data-theme="light"] textarea,
    [data-theme="light"] select {
      background: rgba(255, 255, 255, 0.8) !important;
      border-color: rgba(148, 163, 184, 0.4) !important;
      color: #0f172a !important;
    }

    [data-theme="light"] input::placeholder,
    [data-theme="light"] textarea::placeholder {
      color: #64748b !important;
    }

    [data-theme="light"] .text-neutral-900,
    [data-theme="light"] .text-neutral-800,
    [data-theme="light"] .text-neutral-700,
    [data-theme="light"] .text-neutral-100,
    [data-theme="light"] .text-neutral-50 {
      color: #0f172a !important;
    }

    [data-theme="light"] .text-neutral-600,
    [data-theme="light"] .text-neutral-500,
    [data-theme="light"] .text-muted-foreground {
      color: #475569 !important;
    }

    [data-theme="light"] .border-border,
    [data-theme="light"] .border-neutral-200,
    [data-theme="light"] .border-neutral-300,
    [data-theme="light"] .border,
    [data-theme="light"] .border-b,
    [data-theme="light"] .border-t,
    [data-theme="light"] .border-l,
    [data-theme="light"] .border-r {
      border-color: rgba(148, 163, 184, 0.35) !important;
    }

    /* Modern visual language */
    .font-poppins {
      font-family: 'Sora', sans-serif !important;
    }

    .font-roboto {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif !important;
    }

    body,
    p,
    span,
    li,
    input,
    textarea,
    select,
    button {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.01em;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Sora', 'Inter', sans-serif;
      letter-spacing: -0.015em;
    }

    .rounded-2xl,
    .rounded-3xl {
      border-radius: 1.25rem !important;
    }

    .shadow-sm,
    .shadow-md,
    .shadow-lg,
    .shadow-xl,
    .shadow-2xl {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 14px 30px rgba(0, 0, 0, 0.34) !important;
    }

    /* Global cards/panels with stronger glassify */
    [class*="bg-card"],
    [class*="bg-neutral-900"],
    [class*="bg-neutral-800"],
    [class*="bg-slate-900"],
    [class*="bg-slate-950"] {
      background:
        linear-gradient(160deg, rgba(10, 27, 51, 0.62), rgba(16, 20, 21, 0.54)) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Buttons: neon accent + modern interactions */
    .bg-primary,
    button.bg-primary {
      background: #44edcc !important;
      color: #00382e !important;
      box-shadow: 0 0 32px rgba(68, 237, 204, 0.25) !important;
    }

    .bg-secondary,
    button.bg-secondary {
      background: linear-gradient(135deg, #3b82f6 0%, #44edcc 100%) !important;
      color: #eff6ff !important;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.28) !important;
    }

    .bg-primary:hover,
    button.bg-primary:hover,
    .bg-secondary:hover,
    button.bg-secondary:hover {
      transform: translateY(-1px);
      filter: saturate(1.15) brightness(1.06);
    }

    /* Links and active accents */
    a,
    .text-primary,
    .text-primary-500,
    .text-primary-600,
    .text-primary-700 {
      color: #44edcc !important;
    }

    .text-secondary,
    .text-secondary-400,
    .text-secondary-500 {
      color: #60a5fa !important;
    }

    /* Dividers and borders softer */
    hr,
    .border,
    .border-b,
    .border-t,
    .border-l,
    .border-r {
      border-color: rgba(255, 255, 255, 0.09) !important;
    }

    /* Scrollbar with accent */
    .custom-scrollbar::-webkit-scrollbar-thumb,
    [data-theme="dark"] .custom-scrollbar::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, rgba(68, 237, 204, 0.55), rgba(59, 130, 246, 0.4));
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;  /* Tamaño base */
      line-height: 1;   /* CRÍTICO para alineación vertical */
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      /* Configuración de Variable Font existente */
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    [data-theme="dark"] select option {
        background-color: var(--card);
        color: var(--foreground);
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.4);
    }
    [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.6);
    }

    /* Custom Scrollbar Styling */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }
    [data-theme="dark"] .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }
    [data-theme="dark"] .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Styles for PDF.js text layer to improve text selection */
    .textLayer {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        opacity: 1; /* Should be visible for selection */
        line-height: 1.0;
        user-select: text; /* Allow text selection */
        
        /* Prevents mobile browsers from adjusting font sizes */
        -webkit-text-size-adjust: none;
        -moz-text-size-adjust: none;
        text-size-adjust: none;

        /* Prevents issues in forced colors modes (high contrast) */
        forced-color-adjust: none;

        /* Disable ligatures which can interfere with text selection */
        font-feature-settings: "liga" 0;
    }

    .textLayer > span {
        color: transparent; /* Makes text invisible, showing canvas underneath */
        position: absolute;
        white-space: pre;
        cursor: text;
        transform-origin: 0% 0%;
